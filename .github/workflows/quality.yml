name: Source and Docker checks

on:
  push:
    branches: [main, codex/cross-platform-watcher-20261103]
    paths-ignore: ['.github/workflows/quality.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  platform-contract:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/codex/cross-platform-watcher-20261103' }}
    name: Process lifecycle contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-2025]
    steps:
      - name: Check out sample
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.6"
          python-version: "3.12"
          enable-cache: false
      - name: Assert Apple Silicon runner and Python architecture
        if: matrix.os == 'macos-15'
        run: |
          runner_system="$(uname -s)"
          runner_arch="$(uname -m)"
          printf 'runner_system=%s\nrunner_arch=%s\n' "$runner_system" "$runner_arch"
          test "$runner_system" = Darwin
          test "$runner_arch" = arm64
          uv run --no-project --python 3.12 python - <<'PY'
          import platform
          import sys

          python_system = platform.system()
          python_machine = platform.machine().lower()
          python_architecture = platform.architecture()[0]
          print(f"python_executable={sys.executable}")
          print(f"python_system={python_system}")
          print(f"python_machine={python_machine}")
          print(f"python_architecture={python_architecture}")
          assert python_system == "Darwin"
          assert python_machine == "arm64"
          assert python_architecture == "64bit"
          PY
      - name: Test native process and watcher lifecycle contracts
        run: uv run --no-project --python 3.12 python -m unittest discover -s public/tests -p test_processes.py -v

  quality:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/codex/cross-platform-watcher-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out sample
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify isolated GitHub-hosted local Docker engine
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          context="$(docker context show)"
          endpoint="$(docker context inspect "$context" --format '{{.Endpoints.docker.Host}}')"
          engine_os="$(docker --context "$context" info --format '{{.OSType}}')"
          printf 'runner_environment=%s\nrunner_os=%s\ndocker_context=%s\ndocker_endpoint=%s\ndocker_engine_os=%s\n' \
            "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$context" "$endpoint" "$engine_os"
          test "$context" = default
          test "$endpoint" = unix:///var/run/docker.sock
          test "$engine_os" = linux
      - name: Set up Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.6"
          python-version: "3.12"
          enable-cache: false
      - name: Install pinned Chromium for the real browser checkout
        run: uv run --no-project --python 3.12 --with playwright==1.64.1 python -m playwright install --with-deps chromium
      - name: Create durable host evidence folder
        run: |
          mkdir -p evidence/ci
          python3 -c 'import datetime,json,pathlib; pathlib.Path("evidence/ci/workflow-start.json").write_text(json.dumps({"started_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"runtime_status":"NOT_RUN"})+"\n")'
      - name: Test launcher and source acquisition controls
        run: uv run --no-project --python 3.12 python -m unittest discover -s public/tests -v
      - name: Check Python source and formatting
        run: |
          uvx --from ruff==0.17.0 ruff check public
          uvx --from ruff==0.17.0 ruff format --check public
      - name: Compile sample scripts
        run: uv run --no-project --python 3.12 python -m compileall -q public
      - name: Test CI evidence selection and cleanup controls without Docker
        run: uv run --no-project --python 3.12 python public/ci_smoke.py --self-test
      - name: Prove pinned agent cassette miss is playback-only
        run: uv run --no-project --python 3.12 --with vcrpy==8.3.0 --with httpx==0.28.1 python public/ci_smoke.py --agent-vcr-self-test
      - name: Check documented project-local wrapper
        run: ./shop --no-browser cases
      - name: Run every catalog story, fresh reset, and explicit replay
        run: uv run --no-project --python 3.12 --with playwright==1.64.1 python public/ci_smoke.py --agent-replay
      - name: Preserve stop on failure
        if: always()
        run: uv run --no-project --python 3.12 python public/ci_smoke.py --cleanup
      - name: Check persisted runtime privacy before upload
        id: privacy
        if: always()
        run: uv run --no-project --python 3.12 python public/ci_smoke.py --privacy-check
      - name: Upload durable evidence and visual run viewer
        if: always() && steps.privacy.outputs.allowed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload minimized privacy summary when full evidence is withheld
        if: always() && steps.privacy.outputs.allowed != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-lab-privacy-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/ci/privacy-summary.json
          if-no-files-found: warn
          retention-days: 14
